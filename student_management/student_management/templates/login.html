{% extends "base.html" %}
{% block title %}Sign in · RollBook{% endblock %}
{% block content %}
<section class="login">
  <div class="login-card">
    <h1 class="brand big">Roll<span>Book</span></h1>
    <p class="muted">Sign in to manage student records.</p>
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button class="btn primary full" type="submit">Sign in</button>
    </form>
    <p class="hint">First run? Use <b>admin</b> / <b>admin123</b>.</p>
  </div>
</section>
{% endblock %}
