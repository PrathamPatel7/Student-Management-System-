<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Management{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.get('user_id') %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">Roll<span>Book</span></a>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('students') }}" class="{{ 'on' if request.endpoint in ('students', 'edit_student') }}">Students</a>
      <a href="{{ url_for('add_student') }}" class="{{ 'on' if request.endpoint == 'add_student' }}">Add student</a>
    </nav>
    <div class="user">
      <span>{{ session['username'] }}</span>
      <a href="{{ url_for('logout') }}">Sign out</a>
    </div>
  </header>
  {% endif %}

  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
